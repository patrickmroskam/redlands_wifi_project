# Daily ingest: raw logs from the PRIVATE inbox repo -> data/networks.json, committed to
# main (PRD R5). Raw logs are never public (issue #30 / docs/setup/private-inbox.md).
# The logic lives in scripts/publish_ingest.sh (unit-tested); this file only wires it up.
name: Ingest wardrive logs

on:
  schedule:
    # 10:00 UTC = 03:00 PDT / 02:00 PST. Scheduled runs are skipped until the
    # repo variable INGEST_SCHEDULE is 'on'. It must be a REPOSITORY variable, not an
    # environment one: the job-level `if` below is evaluated before the `ingest`
    # environment is resolved, so an environment variable would always read as empty.
    # GitHub pauses schedules after 60 days without repo activity; re-enable from the
    # Actions tab.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: report only, commit and delete nothing'
        type: boolean
        default: false

permissions: {}

# Never let two runs append to the database at the same time; queue, don't cancel.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest
    if: ${{ github.event_name != 'schedule' || vars.INGEST_SCHEDULE == 'on' }}
    runs-on: ubuntu-latest
    # INBOX_TOKEN lives in this environment, whose deployment-branch rule allows only
    # `main`. That is what keeps the inbox key away from pull-request runs — no
    # `pull_request` trigger above can reach it, on any branch. Because the rule applies
    # to every run of this job, the workflow (including a dry run) only runs on main.
    environment: ingest
    timeout-minutes: 15
    permissions:
      contents: write   # commit the database to main
      pages: write      # only to request a Pages build if the push didn't start one
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      INBOX_REPO: patrickmroskam/redlands_wifi_inbox
      INBOX_DIR: inbox
    steps:
      # Defence in depth: the environment's branch rule already stops this, but a rule
      # can be relaxed by accident, and INBOX_TOKEN is then the only thing between a
      # branch and the owner's raw drive logs. Dry runs are NOT exempt: this job checks
      # out the private inbox before it knows whether the run is dry, so a dry run on a
      # branch is just as much of a disclosure as a real one.
      - name: Refuse to run from a branch other than main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::The ingest job only runs on main (got ${GITHUB_REF})."
          exit 1

      # Check out the branch tip, not the event SHA: a run queued behind another
      # must see the previous run's commit. No persisted token while tests run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # A GITHUB_TOKEN push does not trigger CI, so gate the data change here. This runs
      # before the inbox is fetched, so the tests never see a raw log.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      # The private inbox holds the owner's raw logs. It is checked out inside the
      # workspace because actions/checkout requires that. What keeps those logs out of
      # this public repo is that publish_ingest.sh stages an explicit allowlist (the
      # three data/*.json paths) and never `git add`s the inbox when it is its own repo.
      # `/inbox/` in .gitignore is a second line of defence, not the control; the test
      # `test_the_workflow_inbox_path_is_gitignored` keeps the two in step.
      - name: Check out the private inbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.INBOX_REPO }}
          token: ${{ secrets.INBOX_TOKEN }}
          path: ${{ env.INBOX_DIR }}
          persist-credentials: false

      - name: Ingest and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            scripts/publish_ingest.sh --dry-run
          else
            # Push credentials exist only for this step, and only for a real run. Each
            # repo gets its own header: the site token cannot reach the inbox, and the
            # inbox key cannot reach the site.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
            inbox_auth=$(printf 'x-access-token:%s' "$INBOX_TOKEN" | base64 -w0)
            echo "::add-mask::$inbox_auth"
            git -C "$INBOX_DIR" config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $inbox_auth"
            scripts/publish_ingest.sh
          fi

      # Runs even when the publish step failed with exit 1 (bad file) after pushing.
      - name: Make sure GitHub Pages rebuilds
        if: ${{ always() && steps.publish.outputs.pushed_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.publish.outputs.pushed_sha }}
        run: |
          # Wait for a build of the pushed commit; request one if the push didn't start it.
          requested=""
          for i in $(seq 1 30); do
            build=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                      --jq '"\(.commit) \(.status)"' 2>/dev/null || true)
            commit=${build% *}; status=${build#* }
            if [ "$commit" = "$SHA" ]; then
              case "$status" in
                built) echo "Pages built $SHA${requested:+ (after an explicit request)}."; exit 0 ;;
                errored) echo "::error::GitHub Pages build of $SHA failed"; exit 1 ;;
              esac
            elif [ -z "$requested" ] && [ "$i" -ge 12 ]; then
              echo "No Pages build for $SHA after 2 minutes; requesting one."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .status
              requested=1
            fi
            sleep 10
          done
          echo "::error::No finished Pages build for $SHA after 5 minutes (latest: $build)"
          exit 1
